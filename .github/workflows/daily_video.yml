name: Auto Post Video (Reels)

on:
  schedule:
    - cron: '17 */6 * * *'  # Chạy mỗi 6 tiếng
  workflow_dispatch:        # cho phép chạy thủ công

jobs:
  send-video:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('lucas-video-bot/requirements.txt') }}

      - name: Install dependencies
        run: |
          cd lucas-video-bot
          pip install -r requirements.txt
          playwright install chromium --with-deps
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run video bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          cd lucas-video-bot
          python main.py

      - name: Save seen articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lucas-video-bot/seen_articles.json
          git diff --staged --quiet || git commit -m "chore: update video seen articles [skip ci]"
          git push
