name: Auto Post Product (Reels)

on:
  schedule:
    - cron: '0 */4 * * *'  # Chạy mỗi 4 tiếng (6 bài/ngày)
  workflow_dispatch:        # cho phép chạy thủ công

jobs:
  send-product-video:
    runs-on: ubuntu-latest

    # Repo để GITHUB_TOKEN mặc định là read-only, nên không khai báo ở đây
    # là bước ghi lịch sử bị 403 khi push. Trước giờ bị "|| true" nuốt mất.
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd lucas-story
          pip install -r requirements.txt
          playwright install chromium --with-deps
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run product video bot
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          cd lucas-story
          python main_product.py

      - name: Ghi lịch sử bài đăng
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          # Chỉ add file thật sự tồn tại. "git add a.json b.json" mà thiếu
          # một file là abort toàn bộ, không stage được gì cả.
          for f in product_history.json lucas-story/seen_articles.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "chore: log bai san pham [skip ci]"
          git push
