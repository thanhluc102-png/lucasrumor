name: Auto Post (Every 4 Hours)

on:
  schedule:
    - cron: '17 1,5,9,13 * * *'  # Chạy mỗi 4 tiếng, né ban đêm (8:17, 12:17, 16:17, 20:17 VN)
  workflow_dispatch:        # cho phép chạy thủ công trên GitHub

jobs:
  send-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: playwright install chromium --with-deps

      - name: Sync Facebook insights
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python sync_insights.py

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python main.py

      - name: Save seen articles and insights
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Chỉ add file thật sự tồn tại. "git add a.json b.json" mà thiếu một
          # file là abort toàn bộ, KHÔNG stage gì cả — và "|| true" ở đây từng
          # che mất chuyện đó suốt 6 ngày sau khi product_history.json bị bỏ.
          for f in seen_articles.json post_history.json product_history.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "chore: update stats [skip ci]"
          git push
