<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    font-family: 'Inter', -apple-system, sans-serif;
    background: #0f172a;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ══ TOP IMAGE BLOCK ══ */
  .cover-block {
    width: 100%;
    height: 540px; /* Cố định 50% khung hình */
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  .cover-block img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .watermark {
    position: absolute;
    top: 30px; right: 36px;
    display: flex; align-items: center; gap: 10px;
    background: rgba(15, 23, 42, 0.7);
    backdrop-filter: blur(12px);
    padding: 8px 18px 8px 8px;
    border-radius: 50px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .wm-icon {
    width: 32px; height: 32px; border-radius: 50%; overflow: hidden;
  }
  .wm-icon img { width: 100%; height: 100%; object-fit: contain; }
  .wm-text { font-size: 16px; font-weight: 800; color: #fff; letter-spacing: 0.5px; }

  /* ══ BOTTOM CONTENT BLOCK ══ */
  .content-block {
    flex: 1;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 60%, #1d4ed8 100%);
    padding: 36px 50px;
    position: relative;
    color: #fff;
    display: flex;
    flex-direction: column;
  }
  .content-block::before {
    content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 24px 24px; pointer-events: none;
  }

  /* Header row inside content */
  .meta-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px; position: relative; z-index: 1;
  }
  .category-wrap { display: flex; align-items: center; gap: 12px; }
  .category-icon { font-size: 34px; }
  .category-tag {
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px; padding: 8px 18px;
    font-size: 19px; font-weight: 700; color: #93c5fd;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .date-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px; color: rgba(255,255,255,0.6);
  }

  .title {
    font-size: 56px; font-weight: 900; line-height: 1.22; letter-spacing: -1px;
    color: #fff; margin-bottom: 18px; position: relative; z-index: 1;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .summary {
    font-size: 34px; color: rgba(255,255,255,0.88); line-height: 1.5;
    margin-bottom: 18px; position: relative; z-index: 1;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }


  /* ══ FOOTER ══ */
  .footer-row { display: flex; align-items: center; justify-content: space-between; margin-top: 20px; position: relative; z-index: 1; flex-shrink: 0; }
  .footer-meta { font-family: 'JetBrains Mono', monospace; font-size: 20px; color: rgba(255,255,255,0.5); }
  .sources { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
  .source-chip { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 8px 16px; font-size: 18px; color: rgba(255,255,255,0.65); }

</style>
</head>
<body>

{% if image_b64 %}
<!-- ẢNH COVER (TOP) -->
<div class="cover-block">
  <img src="{{ image_b64 }}" alt="Cover">
  <!-- WATERMARK -->
  <div class="watermark">
    <div class="wm-icon"><img src="{{ logo_b64 }}" alt="Lucas"></div>
    <div class="wm-text">RUMOR</div>
  </div>
</div>
{% endif %}

<!-- NỘI DUNG (BOTTOM) -->
<div class="content-block">
  
  <div class="meta-row">
    <div class="category-wrap">
      {% if visual_type == "community" %}
      <span class="viral-badge"><span class="viral-dot"></span>Đang Viral</span>
      {% else %}
      <span class="category-icon">{{ category_icon }}</span>
      <span class="category-tag">{{ category }}</span>
      {% endif %}
    </div>
    <div class="date-badge">{{ date }}</div>
  </div>

  <div class="title">{{ title }}</div>
  <div class="summary">{{ summary }}</div>

  <div style="margin-top: auto;"></div>

  <!-- FOOTER -->
  <div class="footer-row">
    <div class="footer-meta">Lucas News &bull; Chi tiết ở comment 👇</div>
    <div class="sources">
      {% for src in sources %}<span class="source-chip">{{ src }}</span>{% endfor %}
    </div>
  </div>

</div>
</body>
</html>
