<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap');
  
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    width: 1080px;
    height: 1920px;
    font-family: 'Inter', sans-serif;
    color: #ffffff;
    background-color: #000;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  /* Ảnh nền mờ toàn màn hình */
  .bg-layer {
    position: absolute;
    top: -5%;
    left: -5%;
    width: 110%;
    height: 110%;
    {% if image_b64 %}
    background-image: url('{{ image_b64 }}');
    {% else %}
    background-image: linear-gradient(135deg, #1a1a1a, #000000);
    {% endif %}
    background-size: cover;
    background-position: center;
    filter: blur(40px) brightness(0.3);
    z-index: 0;
  }

  /* Khối lưới hạt (Noise effect) */
  .noise {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.05"/%3E%3C/svg%3E');
    z-index: 1;
    pointer-events: none;
  }

  /* Header (Logo & Brand) */
  .header {
    position: absolute;
    top: 80px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2;
  }

  .header img {
    height: 60px;
    opacity: 0.9;
  }

  /* Main Content Container (Glassmorphism) */
  .card {
    position: relative;
    z-index: 2;
    width: 900px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 40px;
    padding: 60px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 30px 60px rgba(0,0,0,0.4);
  }

  /* Badge / Category */
  .category-badge {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(135deg, #FF2E54, #FF0036);
    padding: 12px 28px;
    border-radius: 50px;
    font-size: 28px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    align-self: flex-start;
    margin-bottom: 40px;
    box-shadow: 0 10px 20px rgba(255, 0, 54, 0.3);
  }

  .title {
    font-size: 65px;
    font-weight: 900;
    line-height: 1.25;
    margin-bottom: 40px;
    background: linear-gradient(to right, #ffffff, #e0e0e0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  {% if image_b64 %}
  .hero-image {
    width: 100%;
    height: 600px;
    border-radius: 24px;
    object-fit: cover;
    margin-bottom: 40px;
    border: 2px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  {% endif %}

  .summary {
    font-size: 40px;
    color: rgba(255, 255, 255, 0.9);
    line-height: 1.6;
    font-weight: 500;
  }

  /* Viral pulse effect (static style for ffmpeg zoom) */
  .viral-indicator {
    position: absolute;
    bottom: 80px;
    display: flex;
    align-items: center;
    gap: 15px;
    z-index: 2;
    background: rgba(0, 0, 0, 0.5);
    padding: 15px 35px;
    border-radius: 50px;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .viral-dot {
    width: 16px;
    height: 16px;
    background-color: #ff3b30;
    border-radius: 50%;
    box-shadow: 0 0 20px #ff3b30;
  }

  .viral-text {
    font-size: 26px;
    font-weight: 600;
    color: #ff3b30;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

</style>
</head>
<body>

  <!-- Background -->
  <div class="bg-layer"></div>
  <div class="noise"></div>

  <!-- Header -->
  <div class="header">
    <img src="{{ logo_b64 }}" alt="Lucas Combo">
  </div>

  <!-- Main Card -->
  <div class="card">
    <div class="category-badge">
      <span>{{ category_icon }}</span> {{ category }}
    </div>

    <div class="title">{{ title }}</div>

    {% if image_b64 %}
    <img class="hero-image" src="{{ image_b64 }}" />
    {% endif %}

    <div class="summary">{{ summary }}</div>
  </div>

  <!-- Bottom Indicator -->
  <div class="viral-indicator">
    <div class="viral-dot"></div>
    <div class="viral-text">HOT TRENDING</div>
  </div>

</body>
</html>
