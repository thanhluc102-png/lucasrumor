<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    width: 1080px;
    height: 1920px;
    font-family: 'Inter', sans-serif;
    color: #111;
    background: linear-gradient(135deg, #f8f9fa, #e9ecef);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Header */
  .header {
    width: 100%;
    padding: 60px 80px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .header img {
    height: 70px;
  }
  
  .badge-new {
    background: #000;
    color: #fff;
    padding: 12px 24px;
    border-radius: 30px;
    font-weight: 700;
    font-size: 24px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  /* Main Card */
  .product-card {
    width: 920px;
    background: #ffffff;
    border-radius: 60px;
    padding: 60px;
    margin-top: 40px;
    box-shadow: 0 40px 80px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  .product-image-container {
    width: 100%;
    height: 750px;
    border-radius: 40px;
    background: #f8f9fa;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    margin-bottom: 50px;
  }

  .product-image {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .product-title {
    font-size: 55px;
    font-weight: 800;
    text-align: center;
    line-height: 1.3;
    margin-bottom: 30px;
    color: #1a1a1a;
  }

  .product-desc {
    font-size: 32px;
    color: #666;
    text-align: center;
    line-height: 1.5;
    margin-bottom: 50px;
    padding: 0 20px;
  }

  .price-container {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 50px;
  }

  .price-sale {
    font-size: 65px;
    font-weight: 900;
    color: #FF0036;
  }

  .price-regular {
    font-size: 40px;
    font-weight: 600;
    color: #999;
    text-decoration: line-through;
  }

  /* CTA Button */
  .cta-button {
    background: linear-gradient(135deg, #FF2E54, #FF0036);
    color: #fff;
    font-size: 36px;
    font-weight: 700;
    padding: 30px 100px;
    border-radius: 100px;
    text-transform: uppercase;
    box-shadow: 0 20px 40px rgba(255, 0, 54, 0.3);
    display: flex;
    align-items: center;
    gap: 15px;
  }
  
  .cta-button svg {
    width: 40px;
    height: 40px;
  }

  /* Decorative Elements */
  .swipe-up {
    position: absolute;
    bottom: 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    animation: bounce 2s infinite;
  }

  .swipe-up span {
    font-size: 28px;
    font-weight: 700;
    color: #333;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .swipe-up svg {
    width: 50px;
    height: 50px;
    color: #333;
  }
</style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <img src="{{ logo_b64 }}" alt="Lucas">
    <div class="badge-new">Sản Phẩm Mới</div>
  </div>

  <!-- Main Card -->
  <div class="product-card">
    <div class="product-image-container">
      <img class="product-image" src="{{ image_b64 }}" />
    </div>

    <div class="product-title">{{ title }}</div>
    
    <div class="product-desc">{{ description }}</div>

    <div class="price-container">
      <div class="price-sale">{{ price }}</div>
      {% if regular_price %}
      <div class="price-regular">{{ regular_price }}</div>
      {% endif %}
    </div>

    <div class="cta-button">
      Mua Ngay 
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
    </div>
  </div>

  <!-- Removed swipe up per user request -->
</body>
</html>
